        widget: string
      - label: Resposta
        name: resposta
        widget: text
  - name: avaliacoes
    label: Avaliações de clientes
    file: content/avaliacoes.json
    format: json
    fields:
    - label: Titulo
      name: titulo
      widget: string
    - label: Texto
      name: texto
      widget: string
    - label: Avaliações
      name: itens
      widget: list
      required: false
      fields:
      - label: Nome
        name: autor
        widget: string
      - label: Texto
        name: texto
        widget: text
      - label: Nota (1 a 5)
        name: nota
        widget: number
        value_type: int
        min: 1
        max: 5
    - label: Link para deixar avaliação no Google
      name: link_avaliar
      widget: string
      required: false
  - name: privacidade
