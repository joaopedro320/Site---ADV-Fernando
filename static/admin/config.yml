# Painel de conteúdo (Decap CMS). Salvar = publicar no site (a Vercel atualiza em ~1 min).
backend:
  name: github
  repo: joaopedro320/Site---ADV-Fernando
  branch: main
  base_url: https://advfernando-site.vercel.app
  auth_endpoint: api/auth
media_folder: static/assets/img
public_folder: /assets/img
locale: pt
site_url: https://luizfernandoneves.com.br
display_url: https://luizfernandoneves.com.br
logo_url: /assets/logo/logo-verde.svg
slug:
  encoding: ascii
  clean_accents: true
collections:
- name: artigos
  label: Notícias e artigos
  label_singular: Artigo
  folder: content/artigos
  extension: json
  format: json
  create: true
  delete: true
  identifier_field: titulo
  slug: '{{titulo}}'
  editor:
    preview: false
  sortable_fields:
  - data
  - titulo
  summary: '{{titulo}} ({{categoria}})'
  fields:
  - label: Ordem (número maior aparece depois)
    name: ordem
    widget: number
    value_type: int
    default: 99
  - label: Título
    name: titulo
    widget: string
  - label: Endereço da página
    name: slug
    widget: string
    required: false
    hint: 'Deixe em branco para usar o título. Ex.: plano-de-saude-negou-tratamento'
  - label: Tipo
    name: tipo
    widget: select
    options:
    - label: Artigo
      value: artigo
    - label: Notícia curta
      value: noticia
    default: artigo
  - label: Categoria
    name: categoria
    widget: select
    options:
    - Plano de saúde
    - Direito Médico
    - Direito Odontológico
    - Erro veterinário
    - Direito do Consumidor
    default: Plano de saúde
  - label: Data de publicação
    name: data
    widget: datetime
    format: YYYY-MM-DD
    date_format: DD/MM/YYYY
    time_format: false
    picker_utc: true
    default: '{{now}}'
  - label: Resumo (aparece nos cards e no Google)
    name: resumo
    widget: text
  - label: Imagem de capa
    name: imagem
    widget: image
    required: false
    hint: Prefira .webp, 1600 px de largura
  - label: Texto do artigo
    name: texto
    widget: markdown
    buttons:
    - bold
    - italic
    - heading-two
    - heading-three
    - bulleted-list
    - numbered-list
    - link
    editor_components: []
    modes:
    - rich_text
  - &id001
    label: Perguntas frequentes
    name: faq
    widget: list
    required: false
    fields:
    - label: Pergunta
      name: pergunta
      widget: string
      required: true
    - label: Resposta
      name: resposta
      widget: text
      required: true
  - label: Chamada para o WhatsApp (final do artigo)
    name: cta
    widget: string
    required: false
  - label: Versão completa deste resumo (endereço do artigo completo)
    name: artigo_completo
    widget: string
    required: false
    hint: Só para notícias curtas que resumem um artigo. Deixe em branco nos artigos normais.
- name: areas
  label: Áreas de atuação
  label_singular: Área
  folder: content/areas
  extension: json
  format: json
  create: false
  identifier_field: titulo
  slug: '{{slug}}'
  fields:
  - label: Ordem
    name: ordem
    widget: number
    value_type: int
  - label: Número (I, II...)
    name: numero
    widget: string
  - label: Endereço da página
    name: slug
    widget: string
  - label: Título curto (menu e cards)
    name: titulo_curto
    widget: string
  - label: Título completo
    name: titulo
    widget: string
  - label: Subtítulo
    name: subtitulo
    widget: text
  - label: Chamada curta (cards da home)
    name: chamada
    widget: string
    required: false
  - label: Descrição para o Google (até 155 caracteres)
    name: descricao_seo
    widget: text
  - label: Título da introdução
    name: intro_titulo
    widget: string
    required: false
  - label: Parágrafos
    name: paragrafos
    widget: list
    field:
      label: Parágrafo
      name: p
      widget: text
    required: false
  - label: Título da lista
    name: rotulo_lista
    widget: string
    required: false
  - label: Itens da lista
    name: itens
    widget: list
    field:
      label: Item
      name: i
      widget: string
    required: false
  - label: Chamada para o WhatsApp
    name: cta
    widget: string
  - label: Cor (verde = saúde, azul = civil e consumidor)
    name: cor
    widget: select
    options:
    - verde
    - azul
  - label: Imagem
    name: imagem
    widget: image
    required: false
  - label: Blocos extras
    name: blocos
    widget: list
    required: false
    fields:
    - label: Título
      name: titulo
      widget: string
      required: true
    - label: Parágrafos
      name: paragrafos
      widget: list
      required: false
      field:
        label: Parágrafo
        name: p
        widget: text
    - label: Itens
      name: itens
      widget: list
      required: false
      field:
        label: Item
        name: i
        widget: string
    - label: Lista numerada?
      name: numerada
      widget: boolean
      required: false
  - label: Frase em destaque
    name: destaque
    widget: string
    required: false
  - label: Parágrafos finais
    name: paragrafos_final
    widget: list
    required: false
    field:
      label: Parágrafo
      name: p
      widget: text
  - label: Categoria dos artigos relacionados
    name: categoria_artigos
    widget: select
    required: false
    options:
    - Plano de saúde
    - Direito Médico
    - Direito Odontológico
    - Erro veterinário
    - Direito do Consumidor
